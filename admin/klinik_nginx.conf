    # --- Short URLs Auto-Redirect to Klinik Product ---
    location ~ ^/(activity-logs|billing|reservations|patients|doctors|branches|treatments|medical-records|inventory|payroll|promos|content|notifications|users|reports)(/*.)?$ {
        return 301 https://$host/product/klinik$request_uri;
    }

    # --- Nina Dental Care API (backend) ---
    location /product/klinik/api/ {
        proxy_pass http://localhost:8092/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Nina Dental Care Web Admin ---
    location /product/klinik {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- APK Downloads ---
    location /downloads/ {
        alias /var/www/html/downloads/;
        default_type application/vnd.android.package-archive;
    }
