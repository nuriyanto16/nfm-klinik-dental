name: core-api

on:
  push:
    branches: [main]
    paths: ["services/core-api/**", ".github/workflows/core-api.yml"]
  pull_request:
    paths: ["services/core-api/**", ".github/workflows/core-api.yml"]

defaults:
  run:
    working-directory: services/core-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nina_dental_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nina_dental_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: services/core-api
          push: false
          tags: ghcr.io/nina-dental-care/core-api:latest
