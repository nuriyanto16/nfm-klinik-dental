# Shared-VPS override: this host already runs its own nginx + several other
# unrelated apps (each exposed on its own host port, no per-app reverse
# proxy container) — see e.g. the "satrianusantara" stack on 4000/8090/8091.
# This follows the same convention instead of docker-compose.prod.yml's
# Traefik setup, which assumes this host owns ports 80/443 and its own DNS
# (neither is true here — an external proxy at nfmtech.my.id is expected to
# forward /product/klinik/* to these ports on this VPS's IP).
#
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
services:
  postgres:
    ports: ["5435:5432"]

  redis:
    ports: ["6381:6379"]

  core-api:
    ports: ["8092:8080"]
    environment:
      APP_ENV: production

  payment-service:
    ports: ["8093:8081"]
    environment:
      APP_ENV: production

  notification-service:
    ports: ["8094:8082"]
    environment:
      APP_ENV: production

  admin-frontend:
    ports: ["4001:3000"]
